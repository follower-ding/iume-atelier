spring:
  application:
    name: iume-atelier-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

iume:
  llm:
    enabled: true
    api-key: ${IUME_LLM_API_KEY:}
    base-url: ${IUME_LLM_BASE_URL:https://api.deepseek.com}
    model: ${IUME_LLM_MODEL:deepseek-chat}
  jwt:
    secret: iume-atelier-jwt-secret-key-change-in-production-must-be-at-least-256-bits-long!!
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  storage:
    type: ${IUME_STORAGE_TYPE:local}
    local:
      dir: ${IUME_UPLOAD_DIR:uploads}
    s3:
      endpoint: ${IUME_S3_ENDPOINT:}
      region: ${IUME_S3_REGION:auto}
      bucket: ${IUME_S3_BUCKET:}
      access-key: ${IUME_S3_ACCESS_KEY:}
      secret-key: ${IUME_S3_SECRET_KEY:}
      public-base-url: ${IUME_S3_PUBLIC_BASE_URL:}
      prefix: ${IUME_S3_PREFIX:uploads/}
  app:
    version: 1.2.1
    site-url: http://localhost:5173

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
