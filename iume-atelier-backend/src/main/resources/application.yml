server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: iume-atelier-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  version: ${APP_VERSION:1.0.0}

security:
  jwt:
    secret: ${JWT_SECRET:please-change-me-to-a-random-string-at-least-32-chars}
    expire-hours: 24

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
