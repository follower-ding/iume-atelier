name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build backend
        working-directory: iume-atelier-backend
        run: mvn -q -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: iume-atelier-frontend/package-lock.json
      - name: Install & build
        working-directory: iume-atelier-frontend
        run: |
          npm install --no-audit --no-fund
          npm run tool:check
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install frontend deps
        working-directory: iume-atelier-frontend
        run: npm install --no-audit --no-fund
      - name: Install Playwright
        working-directory: iume-atelier-frontend
        run: npx playwright install chromium
      - name: Run E2E (smoke)
        working-directory: iume-atelier-frontend
        run: npm run test:e2e
        env:
          CI: true
