# Railway 一键部署后端 + MySQL
# 文档：https://docs.railway.app/
# 在 Railway Dashboard → New Project → Deploy from GitHub repo

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.backend"
watchPatterns = ["iume-atelier-backend/**", "deploy/Dockerfile.backend"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

# Railway 环境变量（在 Dashboard 设置）：
# SPRING_PROFILES_ACTIVE=prod
# SPRING_DATASOURCE_URL=jdbc:mysql://${{MySQL.MYSQLHOST}}:${{MySQL.MYSQLPORT}}/${{MySQL.MYSQLDATABASE}}?useSSL=true&requireSSL=true&serverTimezone=UTC
# SPRING_DATASOURCE_USERNAME=${{MySQL.MYSQLUSER}}
# SPRING_DATASOURCE_PASSWORD=${{MySQL.MYSQLPASSWORD}}
# IUME_JWT_SECRET=<随机 256bit 字符串>
# IUME_CORS_ORIGINS=https://your-app.vercel.app,https://your-app.netlify.app
# IUME_SITE_URL=https://your-app.vercel.app
# IUME_APP_VERSION=1.0.0
