name: iume-atelier

services:
  mysql:
    image: mysql:8.0
    container_name: iume-atelier-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      MYSQL_DATABASE: iume_atelier_db
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ../iume-atelier-backend/sql/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../iume-atelier-backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: iume-atelier-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: iume_atelier_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-random-string-at-least-32-chars}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: iume-atelier-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql_data:
