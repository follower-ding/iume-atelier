services:
  mysql:
    image: mysql:8.0
    container_name: iume-atelier-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iume_atelier_db}
      MYSQL_USER: ${MYSQL_USER:-iume}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-iume_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: iume-atelier-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-iume_atelier_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-iume}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-iume_pass}
      IUME_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      IUME_APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: iume-atelier-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
