[build]
  base = "iume-atelier-frontend"
  command = "npm run build"
  publish = "iume-atelier-frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# API proxy — replace URL after Railway deploy (must be BEFORE SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE_WITH_RAILWAY_BACKEND_URL/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
