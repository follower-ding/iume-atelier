[build]
  base = "iume-atelier-frontend"
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API proxy to Railway backend (must be BEFORE SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "https://iume-atelier-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
